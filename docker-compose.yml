services:
  # this container is a temporary one to just give the debezium user creation script permissions to run
  # This container and the postgres container both bind-mount the same ./init-postgres directory
  # so once the file has been chmoded it can run at postgres container startup
  fix-postgres-init-perms:
    image: busybox
    volumes:
      - ./init-postgres:/scripts
    command: ["sh", "-c", "chmod +x /scripts/*.sh"]

  postgres:
    image: postgres:17
    # logical replication is what Debezium's CDC connector reads from
    command: ["postgres", "-c", "wal_level=logical"]
    depends_on:
      fix-postgres-init-perms:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
    volumes:
      # bind mounts postgres_data on local host to /var/lib/postgresql/data on container
      - ~/banking-app-volumes/postgres_data:/var/lib/postgresql/data
      # everything in /docker-entrypoint-initdb.d runs at startup
      - ./init-postgres:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
  # PLAINTEXT (port 19092 internally) is what other containers — your app, and eventually a Debezium/Connect container — use to reach Kafka, advertised as kafka:19092 over the Docker network. PLAINTEXT_HOST (port 9092, mapped to the host) is for you, from outside Docker — a local Python script, kcat, or a Kafka UI tool — advertised as localhost:9092. Mixing these up is the single most common "Kafka works from one place but not the other" bug in Docker setups, so I kept them distinct on purpose.
  # CONTROLLER (port 29093) is KRaft's internal consensus listener — not exposed to the host, only used by the broker talking to itself in this single-node setup.
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092" 
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  debezium:
    image: quay.io/debezium/connect:3.7.0.Final
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # internal PLAINTEXT listener — debezium is its own container, same as app
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      #  # The following two parameters are for passing env variables to postgres connector json file since its not a bash file
      # CONNECT_CONFIG_PROVIDERS registers the provider *name* ("env") in Connect's
      # active provider list; CONNECT_CONFIG_PROVIDERS_ENV_CLASS maps that same
      # name to its implementation class. Both must reference the same name.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_USER: ${DEBEZIUM_USER}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}

  debezium-connector-init:
  # this throwaway container is used to send a post request to the kafka connect api with the connector config json
    image: curlimages/curl:latest
    depends_on:
      - debezium
    volumes:
      - ./kafka/connect/postgres_connector.json:/connector.json:ro
      - ./kafka/connect/register-connector.sh:/register-connector.sh:ro
    # invoked as `sh script.sh`, not executed directly, so no chmod +x needed
    entrypoint: ["sh", "/register-connector.sh"]

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_HOSTNAME: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

# # to persist db data when docker-compose down
# commented out volumes since I've bind mounted local directories to persist data.
# if i had left this, the volumes would have been persisted in this directory but on the Linux VM that Docker is running on
# not my local filesystem so although it would be persisted I wouldn't be able to access it.
# volumes:
#   postgres_data:
