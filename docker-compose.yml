services:
  postgres:
    image: postgres:17
    # logical replication is what Debezium's CDC connector reads from
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data # this is a persisted volume 
      # everything in /docker-entrypoint-initdb.d runs at startup so scripts is bind mounted to it
      - ./scripts/init_debezium_user.sh:/docker-entrypoint-initdb.d/init_debezium_user.sh
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.8
    ports:
      - 5050:80
    environment:
      # Required by pgAdmin
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
      # Don't require the user to login
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      # Don't require a "master" password after logging in
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    configs:
      - source: pgadmin-pgpass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: 0444

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
  # PLAINTEXT (port 19092 internally) is what other containers — your app, and eventually a Debezium/Connect container — use to reach Kafka, advertised as kafka:19092 over the Docker network. PLAINTEXT_HOST (port 9092, mapped to the host) is for you, from outside Docker — a local Python script, kcat, or a Kafka UI tool — advertised as localhost:9092. Mixing these up is the single most common "Kafka works from one place but not the other" bug in Docker setups, so I kept them distinct on purpose.
  # CONTROLLER (port 29093) is KRaft's internal consensus listener — not exposed to the host, only used by the broker talking to itself in this single-node setup.
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092" 
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # This is a process (server) running Kafka Connect
  # It is what Debezium's Postgres connector runs inside, 
  # and it is also what the S3 sink runs inside. 
  # The two connectors are just JSON configs that tell this worker what to do.
  connect:
    image: quay.io/debezium/connect
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./kafka/connect/plugins/confluentinc-kafka-connect-s3-12.1.15:/kafka/connect/kafka-connect-s3:ro
      - ./kafka/connect/postgres_connector.json:/connectors/postgres.json:ro
      - ./kafka/connect/minio-connector.json:/connectors/minio.json:ro
      - ./kafka/connect/register-connectors.sh:/register-connectors.sh:ro
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_USER: ${DEBEZIUM_USER}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Values carry their schema: every message becomes
      # {"schema": {...}, "payload": {before, after, op, ...}}.
      # needed for the S3 sink to write the payload fields as Parquet columns, 
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
    command: ["sh", "-c", "sh /register-connectors.sh & exec /docker-entrypoint.sh start"]
    healthcheck:
      test: ["CMD-SHELL", "s=$$(curl -fs localhost:8083/connectors?expand=status) && echo \"$$s\" | grep -q postgres-connector && echo \"$$s\" | grep -q minio-sink-connector && ! echo \"$$s\" | grep -q FAILED"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
      

  migrate:
    build: .
    image: banking-app:local # built from app image so import dependencies works
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env 
    environment:
      DATABASE_HOSTNAME: postgres
      DATABASE_PORT: "5432"
    volumes:
      - ./alembic:/code/alembic:ro # moves alembic directory into image's workdir /code
      - ./alembic.ini:/code/alembic.ini:ro
    command: ["alembic", "upgrade", "head"]
    
  # A real Flink session cluster, replacing the embedded MiniCluster that used
  # to be the only way to run this job. The MiniCluster is still available for
  # the host dev loop — FLINK_EMBEDDED defaults to 1, so
  #   flink/.venv-flink/bin/python -m flink.create_enriched_stream
  # still works unchanged and now pins its web UI to 8081.
  #
  # What the two roles do:
  #   jobmanager   the coordinator. Accepts submissions, turns the job graph
  #                into a parallel execution graph, hands subtasks to slots,
  #                triggers checkpoints, and restarts the job from the last
  #                checkpoint when a task dies. It runs no user code.
  #   taskmanager  the worker. Owns task slots, runs the actual operators
  #                (the Kafka sources, the interval join, the aggregate, the
  #                upsert sink), holds their state, and exchanges data with
  #                other taskmanagers. Adding throughput means adding these.
  #
  # The split is what the MiniCluster collapsed into one process, and it is why
  # the job used to die with the Python interpreter.
  #
  # All three services share one image (flink/Dockerfile): the submitter needs
  # the job code and the connector jar to build the graph, the taskmanager
  # needs the jar to run it, and the jobmanager needs neither but costs nothing
  # to build once.
  #
  # platform is not optional on Apple Silicon: PyFlink ships no linux/aarch64
  # wheel, so the image must be amd64 and runs under emulation.
  # Fixes ownership on the checkpoint volumes before the cluster starts. Docker
  # creates a named volume root-owned and mode 755, and only inherits the
  # image's ownership when the image ships content at the mount path — which
  # the Flink image does not. The jobmanager runs as uid 9999 (flink), so
  # without this it cannot create the per-job checkpoint subdirectories and the
  # job dies at submission with:
  #   IOException: Failed to create directory for shared state:
  #     file:/flink-checkpoints/<job-id>/shared
  # Same class of problem as the minio volume further down, and it only bites
  # on a fresh volume.
  flink-dirs-init:
    image: alpine:latest
    user: "0:0"
    command: ["sh", "-c", "chown -R 9999:9999 /flink-checkpoints /flink-savepoints"]
    volumes:
      - flink_checkpoints:/flink-checkpoints
      - flink_savepoints:/flink-savepoints

  jobmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    image: banking-flink:local
    platform: linux/amd64
    depends_on:
      flink-dirs-init:
        condition: service_completed_successfully
    ports:
      # The web UI and the REST endpoint `flink run -m` targets. A fixed port
      # here, unlike the MiniCluster's ephemeral default.
      - "8081:8081"
    command: jobmanager
    environment:
      # The Flink images read this blob and append it to flink-conf.yaml, so
      # it is plain Flink configuration, not shell. Indentation matters.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1
        execution.checkpointing.interval: 30s
        execution.checkpointing.dir: file:///flink-checkpoints
        execution.checkpointing.savepoint-dir: file:///flink-savepoints
    volumes:
      # Checkpoints are what make the job survive a restart: on recovery Flink
      # restores the Kafka offsets and the join/aggregate state from the last
      # one. They must live on storage both roles can reach, hence a shared
      # named volume rather than a path inside either container.
      #
      # file:// is the local-dev choice. In a real deployment this becomes
      # s3://, which also needs the flink-s3-fs-hadoop plugin on the classpath.
      - flink_checkpoints:/flink-checkpoints
      - flink_savepoints:/flink-savepoints

  taskmanager:
    image: banking-flink:local
    platform: linux/amd64
    depends_on:
      jobmanager:
        condition: service_started
      flink-dirs-init:
        condition: service_completed_successfully
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        execution.checkpointing.dir: file:///flink-checkpoints
        execution.checkpointing.savepoint-dir: file:///flink-savepoints
    volumes:
      - flink_checkpoints:/flink-checkpoints
      - flink_savepoints:/flink-savepoints

  # Submits the job and exits — the cluster, not this container, is what keeps
  # it running. `-d` is what makes that true: without it the client stays
  # attached and tearing it down would cancel the job.
  #
  # -pym (module) rather than -py (file path) because the job does
  # `from . import utils`, and a relative import has no parent package when the
  # file is run by path. PYTHONPATH=/opt/banking in the image makes the
  # `flink` package importable.
  flink-job:
    image: banking-flink:local
    platform: linux/amd64
    depends_on:
      jobmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      connect:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # The cluster supplies the jars and the addresses; the embedded-only
      # configuration in create_enriched_stream.py must not be applied here.
      FLINK_EMBEDDED: "0"
      # Checkpointing has to be configured HERE, not only on the jobmanager.
      # execution.checkpointing.interval is read from the client's
      # configuration while the job graph is being built, so setting it only
      # cluster-side leaves it at its default of "disabled" — the REST endpoint
      # then reports interval 9223372036854775807 (Long.MAX_VALUE) and a job
      # that checkpoints never, which restarts from an empty state.
      #
      # The dir is repeated because the client resolves the storage too; it has
      # to name the same shared volume path the cluster mounts.
      FLINK_PROPERTIES: |
        execution.checkpointing.interval: 30s
        execution.checkpointing.dir: file:///flink-checkpoints
        execution.checkpointing.savepoint-dir: file:///flink-savepoints
    command: >
      flink run -d -m jobmanager:8081 -pym flink.create_enriched_stream
    # Deliberately not `on-failure`. This is a one-shot submitter, and a
    # submission that fails *after* the job reached the cluster would be
    # retried into a duplicate job — several copies of the same pipeline all
    # writing to transaction_login_attempts. A failed submit should be read in
    # the logs and fixed, not retried blindly.
    restart: "no"

  # The fraud-scoring consumer. Reads the enriched stream Flink produces,
  # scores each transaction with the XGBoost model baked into the image, and
  # settles it against Postgres.
  consumers:
    build:
      context: .
      dockerfile: kafka/Dockerfile
    image: banking-consumers:local
    env_file: .env
    environment:
      DATABASE_HOSTNAME: postgres
      # Same override as the app service: .env carries 5433 for host-run
      # tooling, and container-to-container traffic wants Postgres' real port.
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # It writes ledger entries and updates transactions, so the schema has to
      # be at head before it consumes anything.
      migrate:
        condition: service_completed_successfully
    # It settles money. If the process dies, the queue keeps filling and
    # transactions sit pending, so bring it back rather than leaving it down.
    restart: unless-stopped

  minio:
    image: quay.io/minio/aistor/minio
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
      - ./minio/minio.license:/minio.license:ro
    command: server --console-address ":9001" /data --license /minio.license
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: quay.io/minio/aistor/minio
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set minio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing minio/bronze minio/warehouse
    restart: "no"

  app:
    build: .
    image: banking-app:local
    env_file: .env
    environment:
      DATABASE_HOSTNAME: postgres
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
    postgres_data:
    minio_data:
    redis_data:
    kafka_data:
    # Shared between jobmanager and taskmanager. Both have to resolve the same
    # file:// path for checkpoint recovery to work at all.
    flink_checkpoints:
    flink_savepoints:


configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Local Postgres",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "${DATABASE_NAME}",
            "Username": "${DATABASE_USERNAME}",
            "PassFile": "/config/pgpass",
            "SSLMode": "prefer"
          }
        }
      }
  
  pgadmin-pgpass:
    content: |
      postgres:5432:*:${DATABASE_USERNAME}:${DATABASE_PASSWORD}